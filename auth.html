
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundFlow | Login</title>
    <link rel="stylesheet" href="/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-brand">
        <h1>Fund<span>Flow.</span></h1>
        <h2>Make a Difference Today.</h2>
        <p>Support meaningful causes, create campaigns and
           help communities grow together.</p>
    </div>

    <div class="auth-card">

        <div class="auth-tabs">
            <button type="button" id="loginTab" class="active">
                Login
            </button>

            <button type="button" id="registerTab">
                Register
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to your FundFlow account.</p>

            <label>Email Address</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="auth-submit">
                Login
            </button>

            <p id="loginMessage" class="auth-message"></p>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="registerForm" hidden>
            <h2>Create Account</h2>
            <p class="subtitle">Join the FundFlow community.</p>

            <label>Full Name</label>
            <input
                type="text"
                id="registerName"
                placeholder="Enter your full name"
                required
                minlength="2"
            >

            <label>Email Address</label>
            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
                minlength="8"
            >

            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
                minlength="8"
            >

            <button type="submit" class="auth-submit">
                Create Account
            </button>

            <p id="registerMessage" class="auth-message"></p>
        </form>

        <p class="auth-footer">
            By continuing, you agree to use FundFlow responsibly.
        </p>

    </div>
</div>

<script src="/auth.js"></script>
</body>
</html>
